name: CE-311 - Verificar cabeceras HTTP

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ce311-security-headers.yml'
      - 'scripts/security/verificar-cabeceras-http.sh'

permissions:
  contents: write

jobs:
  auditar-cabeceras:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar inventario temporal CE-311
        shell: bash
        run: |
          cat > hosts-ce311.txt <<'EOF'
          V-05|www.politica-datos-personales.ccsm.org.co
          V-06|bi.ccsm.org.co
          V-07|ns2.ccsm.org.co
          V-08|cav.ccsm.org.co
          V-09|api.ccsm.org.co
          V-10|onemall.ccsm.org.co
          V-11|sgc.ccsm.org.co
          V-12|magdalena-crece.ccsm.org.co
          V-13|www.aviso-de-privacidad.ccsm.org.co
          V-14|eventos.ccsm.org.co
          V-15|apps.ccsm.org.co
          EOF

          grep -v '^V-10|' hosts-ce311.txt > hosts-ce311-origen-190.txt

      - name: Ejecutar verificador público
        id: audit
        shell: bash
        run: |
          chmod +x scripts/security/verificar-cabeceras-http.sh
          set +e
          scripts/security/verificar-cabeceras-http.sh \
            --hosts-file hosts-ce311.txt \
            --output resultado-ce311-publico.csv \
            | tee resultado-ce311-publico.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "## Resultado público CE-311" >> "$GITHUB_STEP_SUMMARY"
          echo "Código del verificador: $rc" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat resultado-ce311-publico.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar comparación contra origen 190.8.178.82
        id: origin_audit
        shell: bash
        run: |
          set +e
          scripts/security/verificar-cabeceras-http.sh \
            --hosts-file hosts-ce311-origen-190.txt \
            --origin-default 190.8.178.82 \
            --output resultado-ce311-origen-190.csv \
            | tee resultado-ce311-origen-190.txt
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "## Comparación contra origen 190.8.178.82" >> "$GITHUB_STEP_SUMMARY"
          echo "Código del verificador: $rc" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat resultado-ce311-origen-190.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnosticar DNS y destinos finales
        if: always()
        shell: bash
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/150.0.0.0 Safari/537.36'
          : > diagnostico-ce311-dns-destinos.txt

          echo '=== DNS DE LOS 11 HOSTS ===' >> diagnostico-ce311-dns-destinos.txt
          while IFS='|' read -r id host; do
            echo "[$id] $host" >> diagnostico-ce311-dns-destinos.txt
            for resolver in system 1.1.1.1 8.8.8.8; do
              if [[ "$resolver" == system ]]; then
                answers="$({ dig +short CNAME "$host"; dig +short A "$host"; dig +short AAAA "$host"; } 2>/dev/null | sed '/^$/d' | sort -u | paste -sd ';' -)"
              else
                answers="$({ dig +short @"$resolver" CNAME "$host"; dig +short @"$resolver" A "$host"; dig +short @"$resolver" AAAA "$host"; } 2>/dev/null | sed '/^$/d' | sort -u | paste -sd ';' -)"
              fi
              echo "  resolver=$resolver respuesta=${answers:-SIN_RESPUESTA}" >> diagnostico-ce311-dns-destinos.txt
            done
          done < hosts-ce311.txt

          echo >> diagnostico-ce311-dns-destinos.txt
          echo '=== VARIANTES SIN WWW Y DESTINOS CONOCIDOS ===' >> diagnostico-ce311-dns-destinos.txt
          cat > destinos-ce311.txt <<'EOF'
          politica-datos-personales.ccsm.org.co
          aviso-de-privacidad.ccsm.org.co
          www.ccsm.org.co
          sites.google.com
          magdalenacrece.com
          eventos.appsicam.net
          apps.sicam32.net
          EOF

          while read -r host; do
            [[ -n "$host" ]] || continue
            dns="$({ dig +short CNAME "$host"; dig +short A "$host"; dig +short AAAA "$host"; } 2>/dev/null | sed '/^$/d' | sort -u | paste -sd ';' -)"
            set +e
            meta="$(curl -k -sS -L --compressed --http1.1 --tlsv1.2 --max-redirs 5 --connect-timeout 15 --max-time 45 -A "$UA" -o /dev/null -w '%{http_code}|%{url_effective}' "https://${host}/" 2>&1)"
            rc=$?
            set -e
            echo "$host | dns=${dns:-SIN_RESPUESTA} | curl_rc=$rc | $meta" >> diagnostico-ce311-dns-destinos.txt
          done < destinos-ce311.txt

      - name: Publicar artefacto temporal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-ce311-cabeceras
          path: |
            resultado-ce311-publico.csv
            resultado-ce311-publico.txt
            resultado-ce311-origen-190.csv
            resultado-ce311-origen-190.txt
            diagnostico-ce311-dns-destinos.txt
          if-no-files-found: error
          retention-days: 30

      - name: Guardar evidencia en el repositorio
        if: always()
        shell: bash
        run: |
          mkdir -p evidencias/ce311
          cp resultado-ce311-publico.csv evidencias/ce311/resultado-ce311-github-actions.csv
          cp resultado-ce311-publico.txt evidencias/ce311/resultado-ce311-github-actions.txt
          cp resultado-ce311-origen-190.csv evidencias/ce311/resultado-ce311-origen-190.csv
          cp resultado-ce311-origen-190.txt evidencias/ce311/resultado-ce311-origen-190.txt
          cp diagnostico-ce311-dns-destinos.txt evidencias/ce311/diagnostico-ce311-dns-destinos.txt
          {
            echo "fecha_utc=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "workflow_run=${GITHUB_RUN_ID}"
            echo "commit_evaluado=${GITHUB_SHA}"
            echo "codigo_verificador_publico=${{ steps.audit.outputs.exit_code }}"
            echo "codigo_verificador_origen=${{ steps.origin_audit.outputs.exit_code }}"
          } > evidencias/ce311/metadatos-github-actions.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidencias/ce311
          if git diff --cached --quiet; then
            echo "No hay cambios en la evidencia"
          else
            git commit -m "CE-311: actualizar evidencia automática de cabeceras"
            git push
          fi
